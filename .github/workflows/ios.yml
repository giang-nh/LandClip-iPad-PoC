name: iPad PoC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project LandClipIPad.xcodeproj \
            -scheme LandClipIPad \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)' \
            CODE_SIGNING_ALLOWED=NO \
            test
